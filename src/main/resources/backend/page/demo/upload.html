<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文件上传下载演示</title>
    <style>
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; padding: 30px; }
        .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 30px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
        h2 { color: #333; margin-top: 0; }
        .row { margin: 16px 0; }
        button { background: #409EFF; border: none; color: #fff; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: .85; }
        img.avatar { width: 180px; height: 180px; object-fit: cover; border: 1px dashed #ccc; border-radius: 6px; margin-top: 10px; }
        .tip { color: #999; font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h2>文件上传 / 下载演示</h2>
    <div class="row">
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="doUpload()">上传图片</button>
    </div>
    <div class="row tip" id="msg"></div>
    <div class="row">
        <img id="preview" class="avatar" alt="预览(上传后展示)" src="">
    </div>
</div>
<script>
    // 上传：POST /common/upload (multipart/form-data, 文件参数名 file)
    function doUpload() {
        var file = document.getElementById('fileInput').files[0];
        if (!file) { alert('请先选择图片文件'); return; }
        var fd = new FormData();
        fd.append('file', file);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/common/upload');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var res = JSON.parse(xhr.responseText);   // {code:1,data:fileName}
                if (res.code === 1) {
                    document.getElementById('msg').innerText = '上传成功，文件名：' + res.data;
                    // 下载回显：GET /common/download?name=fileName
                    document.getElementById('preview').src = '/common/download?name=' + res.data;
                } else {
                    alert('上传失败：' + res.msg);
                }
            }
        };
        xhr.send(fd);
    }
</script>
</body>
</html>
